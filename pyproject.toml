[project]
name = "chest-x-ray-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tristiii", email = "tristiii.games@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "medmnist>=3.0.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.2",
]

[project.scripts]
chest-x-ray-classifier = "chest_x_ray_classifier:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
